
<div 
    class="overflow-hidden"
>
    <div class="grid gap-0">

        <div class="grid grid-cols-4 bg-gray-50 border-b sticky top-0">
            <div class="px-4 py-2 font-semibold">Date</div>
            <div class="px-4 py-2 font-semibold">Balance</div>
            <div class="px-4 py-2 font-semibold">Income</div>
            <div class="px-4 py-2 font-semibold">Expense</div>
        </div>

        <div 
            class="max-h-96 overflow-y-auto"
            #tableContainer
        >
            @for (day of transactionsRecord().days; track day.date){
                <div
                    #dayRow
                    [id]="'day-' + day.date"
                    [class.ring-2]="isToday(day.date)"
                    [class.ring-blue-500]="isToday(day.date)"
                    class="grid grid-cols-4 border-b hover:bg-gray-50"
                >

                    <div 
                        class="px-4 py-2"
                    >
                        {{parseDate(day.date)}}
                    </div>
                    
                    <div class="px-4 py-2">{{day.balance | currency: 'BRL'}}</div>
                    <div class="px-4 py-2">
                        <div>
                            {{sumIncomeTransactions(day.transactions) | currency: "BRL"}}
                        </div>
                    </div>
                    <div class="px-4 py-2">
                        <div>
                            {{sumExpenseTransactions(day.transactions) | currency: "BRL"}}
                        </div>
                    </div>
                </div>
            }
        </div>
    </div>

    <div>
        <button class="cursor-pointer" (click)="scrollToTodayRecords()">today</button>
    </div>

</div>
