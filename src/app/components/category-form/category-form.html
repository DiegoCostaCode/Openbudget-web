<div
  class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-canvas/90 font-mono"
  (click)="cancelled.emit()"
>
  <div class="w-full max-w-sm" (click)="$event.stopPropagation()">
    <ob-panel variant="primary">
      <ob-panel-bar title="NOVA CATEGORIA" meta="POST /CATEGORY/" position="top" />

      <form (ngSubmit)="submit()" [formGroup]="form" class="p-6 flex flex-col gap-4" novalidate>
        <div>
          <label class="mb-1.5 block text-label uppercase tracking-wider text-fg-muted">
            NOME DA CATEGORIA
          </label>
          <input
            formControlName="name"
            type="text"
            minlength="3"
            maxlength="20"
            placeholder="Ex: INVESTIMENTOS, LAZER..."
            required
            class="w-full border border-line-strong bg-surface-sunken px-3 py-2 text-xs text-fg placeholder:text-fg-subtle outline-none focus:border-fg transition-colors uppercase"
            [class.border-fg]="form.get('name')?.invalid && form.get('name')?.touched"
          />
          @if (form.get('name')?.invalid && form.get('name')?.touched) {
            <span class="mt-1 block text-micro uppercase text-fg">
              ERRO // NOME DEVE TER ENTRE 3 E 20 CARACTERES
            </span>
          }
          @if (errorMessage()) {
            <span class="mt-1 block text-micro uppercase text-fg">
              {{ errorMessage() }}
            </span>
          }
        </div>

        <div class="mt-2 flex items-center justify-end gap-2 border-t border-line-faint pt-4">
          <button
            type="button"
            (click)="cancelled.emit()"
            obButton
            variant="secondary"
            size="md"
          >
            CANCELAR
          </button>
          <button
            type="submit"
            [disabled]="isLoading()"
            obButton
            variant="primary"
            size="md"
          >
            @if (isLoading()) {
              [ SALVANDO... ]
            } @else {
              SALVAR CATEGORIA
            }
          </button>
        </div>
      </form>
    </ob-panel>
  </div>
</div>
